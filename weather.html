        function textSequence(i) {

            if (places.length > i) {
                setTimeout(function() {
                    document.getElementById("location").innerHTML = places[i];
                    textSequence(++i);
                }, 1000); // 1 second (in milliseconds)

            } else if (places.length == i) { // Loop
                textSequence(0);
            }

        }
